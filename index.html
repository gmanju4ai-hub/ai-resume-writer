<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Resume Builder</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header>
      <h1>ResumeAI</h1>
      <p>Create a beautiful job-ready resume in seconds</p>
    </header>

    <!-- CARD -->
    <div class="card">

      <h2>Enter Your Details</h2>

      <input id="name" type="text" placeholder="Full Name" />
      <input id="email" type="email" placeholder="Email Address" />
      <input id="education" type="text" placeholder="Education (e.g. BSc Computer Science)" />
      <input id="skills" type="text" placeholder="Skills (e.g. Excel, Python, Communication)" />
      <textarea id="experience" placeholder="Projects / Experience (optional)"></textarea>

      <button onclick="generateResume()">Generate Resume</button>

    </div>

    <!-- OUTPUT -->
    <div class="card output">
      <h2>Your Resume</h2>
      <pre id="output">Your AI resume will appear here...</pre>

      <button class="secondary" onclick="downloadResume()">Download Resume</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
